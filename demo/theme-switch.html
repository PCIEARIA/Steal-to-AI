<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Steal to AI | Theme switch reconstruction</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      display: grid;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      place-items: center;
      background: #fff;
      font: 600 16px/24px Inter, ui-sans-serif, system-ui, sans-serif;
      transition: background-color .4s;
    }
    body:has(#theme-switch:not(:checked)) { background: #20242b; }
    .component {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #001f3f;
    }
    .hex { width: 69px; font-variant-numeric: tabular-nums; }
    .switch {
      position: relative;
      display: block;
      flex: none;
      width: 60px;
      height: 30px;
      cursor: pointer;
    }
    .switch input {
      position: absolute;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }
    .track {
      position: absolute;
      inset: 0;
      border-radius: 30px;
      background: #cecece;
      transition: background-color .4s;
      pointer-events: none;
    }
    .track::before {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #f2f2f2;
      content: "";
      transition: transform .4s;
    }
    .switch input:checked + .track::before { transform: translateX(30px); }
    .switch input:focus-visible + .track { outline: 2px solid #001f3f; outline-offset: 3px; }
    .icon {
      position: absolute;
      top: 5px;
      width: 20px;
      height: 20px;
      pointer-events: none;
      transition: color .4s;
    }
    .moon { left: 5px; color: #6b7280; }
    .sun { right: 6px; color: #f2f2f2; }
    .switch input:checked ~ .sun { color: #6b7280; }
    body:has(#theme-switch:not(:checked)) .hex { color: #f2f2f2; }
    .color-picker {
      position: relative;
      flex: none;
      width: 30px;
      height: 30px;
      border: 3px solid #d1d5db;
      border-radius: 6px;
      background: var(--selected-color, #e8e8e8);
      cursor: pointer;
    }
    .color-picker input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      opacity: 0;
      cursor: pointer;
    }
    .color-picker:focus-within { outline: 2px solid #001f3f; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) {
      body, .track, .track::before, .icon { transition: none; }
    }
  </style>
</head>
<body>
  <main class="component" aria-label="Theme and color controls">
    <output class="hex" id="color-value" for="color">#e8e8e8</output>
    <label class="switch">
      <input id="theme-switch" type="checkbox" checked aria-label="Light theme">
      <span class="track"></span>
      <svg class="icon moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M21 13.9066C19.805 14.6253 18.4055 15.0386 16.9095 15.0386C12.5198 15.0386 8.9612 11.4801 8.9612 7.09034C8.9612 5.59439 9.37447 4.19496 10.0931 3C6.03221 3.91866 3 7.5491 3 11.8878C3 16.9203 7.07968 21 12.1122 21C16.451 21 20.0815 17.9676 21 13.9066Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <svg class="icon sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 23V22M4.22183 19.7782L4.92893 19.0711M1 12H2M4.22183 4.22183L4.92893 4.92893M12 2V1M19.0711 4.92893L19.7782 4.22183M22 12H23M19.0711 19.0711L19.7782 19.7782M18 12C18 15.3137 15.3137 18 12 18C8.68629 18 6 15.3137 6 12C6 8.68629 8.68629 6 12 6C15.3137 6 18 8.68629 18 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </label>
    <label class="color-picker" title="Choose color">
      <input id="color" type="color" value="#e8e8e8" aria-label="Choose color">
    </label>
  </main>
  <script>
    const colorInput = document.querySelector('#color');
    const colorValue = document.querySelector('#color-value');
    const colorPicker = document.querySelector('.color-picker');
    colorInput.addEventListener('input', () => {
      colorValue.value = colorInput.value;
      colorPicker.style.setProperty('--selected-color', colorInput.value);
    });
  </script>
</body>
</html>
