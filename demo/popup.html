<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steal to AI · Compact Popup Preview</title>
    <link rel="stylesheet" href="../extension/popup.css">
  </head>
  <body>
    <main>
      <section class="panel workspace">
        <div class="masthead">
          <div><div class="wordmark">steal <i>to</i> ai</div><p class="submark">Clean HTML/CSS</p></div>
          <button class="language-tiny" type="button">EN</button>
        </div>
        <button class="primary-action capture-action" type="button"><span class="target" aria-hidden="true"></span>開始選取</button>
        <p class="status">準備好了，挑一個你想帶走的元素。</p>
        <section class="settings-section">
          <div class="section-heading"><span>動態效果</span><small>輸出規則</small></div>
          <div class="choice-list">
            <label class="choice"><input checked type="radio" name="effect"><span class="radio"></span><span><strong>智慧模式（預設）</strong><small>偵測到互動、動畫或偽元素才帶上</small></span></label>
            <label class="choice"><input type="radio" name="effect"><span class="radio"></span><span><strong>全部帶上</strong><small>盡量保留所有可取得的互動規則</small></span></label>
            <label class="choice"><input type="radio" name="effect"><span class="radio"></span><span><strong>純靜態</strong><small>不帶動畫、狀態或過場</small></span></label>
          </div>
        </section>
        <section class="settings-section screenshot-section">
          <div class="section-heading"><span>視覺參考截圖</span></div>
          <label class="toggle-row"><span><strong>儲存選取區域截圖</strong><small>裁成 PNG，直接下載到 Downloads</small></span><input type="checkbox"><span class="toggle"></span></label>
        </section>
        <p class="footer-note">來源腳本、事件與追蹤屬性不會被帶走。</p>
      </section>
    </main>
  </body>
</html>
