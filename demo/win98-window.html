<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Steal to AI | Windows 98 window reconstruction</title>
  <style>
    /* Pixelated MS Sans Serif from 98.css v0.1.21; see assets/98-css-LICENSE.txt. */
    @font-face {
      font-family: "Pixelated MS Sans Serif";
      src: url("assets/ms_sans_serif.woff2") format("woff2");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Pixelated MS Sans Serif";
      src: url("assets/ms_sans_serif_bold.woff2") format("woff2");
      font-weight: 700;
      font-display: swap;
    }
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      display: grid;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      place-items: center;
      background: #fff;
      color: #222;
      font: 11px/1.5 "Pixelated MS Sans Serif", Arial, sans-serif;
    }
    button { font: inherit; }
    .window {
      width: 256px;
      padding: 3px;
      transform: translateY(-1px);
      background: #c0c0c0;
      box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #dfdfdf,
        inset -2px -2px #808080, inset 2px 2px #fff;
    }
    .title-bar {
      display: flex;
      height: 20px;
      align-items: center;
      justify-content: space-between;
      padding: 2px 2px 2px 3px;
      background: linear-gradient(90deg, navy, #1084d0);
      color: #fff;
      font-weight: 700;
      line-height: 14px;
    }
    .title-bar-title { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .title-bar-controls { display: flex; flex: none; margin-left: 8px; }
    .title-bar-controls button, .actions button {
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 0;
      background: #c0c0c0;
      color: #222;
      box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff,
        inset -2px -2px #808080, inset 2px 2px #dfdfdf;
      cursor: default;
    }
    .title-bar-controls button { position: relative; width: 16px; height: 14px; padding: 0; }
    .title-bar-controls .close { margin-left: 2px; }
    .title-bar-controls button:active, .actions button:active {
      box-shadow: inset -1px -1px #fff, inset 1px 1px #0a0a0a,
        inset -2px -2px #dfdfdf, inset 2px 2px #808080;
    }
    button:focus-visible { outline: 1px dotted #000; outline-offset: -4px; }
    .minimize::before { content: ''; position: absolute; left: 4px; bottom: 3px; width: 6px; height: 2px; background: #000; }
    .maximize::before { content: ''; position: absolute; left: 3px; top: 2px; width: 9px; height: 9px; background: #000; }
    .maximize::after { content: ''; position: absolute; left: 4px; top: 4px; width: 7px; height: 6px; background: #c0c0c0; }
    .close::before {
      content: '';
      position: absolute;
      left: 4px;
      top: 3px;
      width: 8px;
      height: 7px;
      background:
        linear-gradient(#000 0 0) 0 0 / 2px 1px,
        linear-gradient(#000 0 0) 6px 0 / 2px 1px,
        linear-gradient(#000 0 0) 1px 1px / 2px 1px,
        linear-gradient(#000 0 0) 5px 1px / 2px 1px,
        linear-gradient(#000 0 0) 2px 2px / 2px 1px,
        linear-gradient(#000 0 0) 4px 2px / 2px 1px,
        linear-gradient(#000 0 0) 3px 3px / 2px 1px,
        linear-gradient(#000 0 0) 2px 4px / 2px 1px,
        linear-gradient(#000 0 0) 4px 4px / 2px 1px,
        linear-gradient(#000 0 0) 1px 5px / 2px 1px,
        linear-gradient(#000 0 0) 5px 5px / 2px 1px,
        linear-gradient(#000 0 0) 0 6px / 2px 1px,
        linear-gradient(#000 0 0) 6px 6px / 2px 1px;
      background-repeat: no-repeat;
    }
    .window-body { margin: 8px; }
    .window-body p { margin: 10px 0 11px; line-height: 16.5px; }
    .actions { display: flex; justify-content: flex-end; gap: 6px; }
    .actions button { width: 75px; height: 23px; padding: 0 12px; line-height: 1; }
    @media (max-width: 300px) { body { padding: 12px; } .window { max-width: 100%; } }
  </style>
</head>
<body>
  <main class="window" aria-label="Windows 98 dialog">
    <div class="title-bar">
      <span class="title-bar-title">My First VB4 Program</span>
      <div class="title-bar-controls">
        <button class="minimize" type="button" aria-label="Minimize"></button>
        <button class="maximize" type="button" aria-label="Maximize"></button>
        <button class="close" type="button" aria-label="Close"></button>
      </div>
    </div>
    <div class="window-body">
      <p>Hello, world!</p>
      <div class="actions">
        <button type="button">OK</button>
        <button type="button">Cancel</button>
      </div>
    </div>
  </main>
</body>
</html>
