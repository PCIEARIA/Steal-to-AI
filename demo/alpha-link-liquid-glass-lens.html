<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Liquid-glass lens</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; overflow: hidden; background: #fff; }
      .stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: #fff; touch-action: none; }
      .background { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; user-select: none; -webkit-user-drag: none; }
      .liquid-lens { --press-x: 0; --press-y: 0; --drag-stretch-x: 0; --drag-stretch-y: 0; --drag-tilt: 0deg; position: absolute; width: 210px; height: 150px; overflow: visible; border: 1px solid rgba(255,255,255,.38); border-radius: 75px; background: rgba(255,255,255,.025); box-shadow: 2.05px 10.15px 16.69px rgba(0,0,0,.184), 1.02px 5.08px 24px rgba(0,0,0,.227) inset, -1.02px -5.08px 24px rgba(255,255,255,.227) inset; backdrop-filter: url(#lens-refraction); -webkit-backdrop-filter: url(#lens-refraction); cursor: grab; transform: rotate(var(--drag-tilt)) scaleX(calc(1.0105 + var(--press-x) + var(--drag-stretch-x))) scaleY(calc(.8109 + var(--press-y) + var(--drag-stretch-y))); transform-origin: 50% 50%; transition: transform 130ms cubic-bezier(.2,.8,.2,1), box-shadow 130ms ease, filter 130ms ease; will-change: transform; touch-action: none; }
      .lens-optic { position: absolute; inset: 0; overflow: hidden; border-radius: inherit; background-image: url("./assets/task-mtfswvmtdph96.png"); background-repeat: no-repeat; filter: saturate(1.18) contrast(1.05); pointer-events: none; }
      .liquid-lens::before { content: ""; position: absolute; inset: 1px; z-index: 1; border: 1px solid rgba(255,255,255,.46); border-radius: inherit; background: radial-gradient(120% 96% at 22% -14%, rgba(255,255,255,.72), transparent 36%), radial-gradient(100% 100% at 94% 108%, rgba(0,122,255,.18), transparent 54%), linear-gradient(132deg, rgba(255,255,255,.24), transparent 34%, rgba(255,255,255,.05) 64%, rgba(255,255,255,.31)); box-shadow: inset 0 1px 1px rgba(255,255,255,.62), inset 0 -12px 22px rgba(0,31,77,.10); mix-blend-mode: screen; pointer-events: none; }
      .liquid-lens::after { content: ""; position: absolute; inset: auto 18px 10px; z-index: 2; height: 30px; border-radius: 50%; background: radial-gradient(ellipse, rgba(188,226,255,.46), transparent 68%); filter: blur(8px); opacity: .86; pointer-events: none; }
      .liquid-lens.is-dragging { cursor: grabbing; }
      .liquid-lens.is-pressed { --press-x: -.052; --press-y: -.064; box-shadow: 1.1px 5px 9px rgba(0,0,0,.16), .7px 4px 20px rgba(0,0,0,.24) inset, -.7px -3px 18px rgba(255,255,255,.25) inset; transition-duration: 85ms; }
      .liquid-lens.is-pressed .lens-optic { filter: saturate(1.25) contrast(1.08) brightness(.99); }
      .liquid-lens.is-rebounding { animation: lens-rebound 620ms cubic-bezier(.22,1.45,.44,1) both; }
      @keyframes lens-rebound {
        0% { transform: scale(.952, .735); }
        38% { transform: scale(1.049, .848); }
        66% { transform: scale(.993, .796); }
        100% { transform: scale(1.0105, .8109); }
      }
      @media (prefers-reduced-motion: reduce) { .liquid-lens { transition: none; } .liquid-lens.is-rebounding { animation: none; } }
    </style>
  </head>
  <body>
    <main class="stage">
      <img class="background" src="./assets/task-mtfswvmtdph96.png" alt="" draggable="false" />
      <svg aria-hidden="true" width="0" height="0" focusable="false">
        <filter id="lens-refraction" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency=".012 .022" numOctaves="2" seed="7" result="waves" />
          <feDisplacementMap in="SourceGraphic" in2="waves" scale="28" xChannelSelector="R" yChannelSelector="G" result="refracted" />
          <feGaussianBlur in="refracted" stdDeviation=".12" />
        </filter>
      </svg>
      <div class="liquid-lens" role="presentation"><div class="lens-optic"></div></div>
    </main>
    <script>
      const stage = document.querySelector('.stage');
      const background = document.querySelector('.background');
      const lens = document.querySelector('.liquid-lens');
      const optic = document.querySelector('.lens-optic');
      let drag;

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function updateOptic() {
        const scale = Math.max(stage.clientWidth / background.naturalWidth, stage.clientHeight / background.naturalHeight);
        const lensZoom = 1.13;
        const imageWidth = background.naturalWidth * scale * lensZoom;
        const imageHeight = background.naturalHeight * scale * lensZoom;
        const imageLeft = (stage.clientWidth - imageWidth) / 2;
        const imageTop = (stage.clientHeight - imageHeight) / 2;
        optic.style.backgroundSize = `${imageWidth}px ${imageHeight}px`;
        optic.style.backgroundPosition = `${imageLeft - lens.offsetLeft * lensZoom}px ${imageTop - lens.offsetTop * lensZoom}px`;
      }

      function centreLens() {
        lens.style.left = `${(stage.clientWidth - lens.offsetWidth) / 2}px`;
        lens.style.top = `${(stage.clientHeight - lens.offsetHeight) / 2}px`;
        updateOptic();
      }

      function updateDragMotion(event) {
        const now = event.timeStamp || performance.now();
        const elapsed = Math.max(16, now - drag.lastTime);
        const velocityX = (event.clientX - drag.lastX) / elapsed;
        const velocityY = (event.clientY - drag.lastY) / elapsed;
        const stretchX = clamp(Math.abs(velocityX) * .018, 0, .045);
        const stretchY = clamp(Math.abs(velocityY) * .018, 0, .04);
        const tilt = clamp(velocityX * .32, -3, 3);
        lens.style.setProperty('--drag-stretch-x', stretchX.toFixed(3));
        lens.style.setProperty('--drag-stretch-y', stretchY.toFixed(3));
        lens.style.setProperty('--drag-tilt', `${tilt.toFixed(2)}deg`);
        drag.lastX = event.clientX;
        drag.lastY = event.clientY;
        drag.lastTime = now;
      }

      lens.addEventListener('pointerdown', (event) => {
        const box = lens.getBoundingClientRect();
        drag = {pointerId: event.pointerId, offsetX: event.clientX - box.left, offsetY: event.clientY - box.top, lastX: event.clientX, lastY: event.clientY, lastTime: event.timeStamp || performance.now()};
        lens.classList.remove('is-rebounding');
        lens.classList.add('is-dragging');
        lens.classList.add('is-pressed');
        lens.setPointerCapture(event.pointerId);
        event.preventDefault();
      });

      lens.addEventListener('pointermove', (event) => {
        if (!drag || event.pointerId !== drag.pointerId) return;
        const width = lens.offsetWidth;
        const height = lens.offsetHeight;
        const left = Math.min(stage.clientWidth - width, Math.max(0, event.clientX - drag.offsetX));
        const top = Math.min(stage.clientHeight - height, Math.max(0, event.clientY - drag.offsetY));
        lens.style.left = `${left}px`;
        lens.style.top = `${top}px`;
        updateDragMotion(event);
        updateOptic();
      });

      function finishDrag(event) {
        if (!drag || event.pointerId !== drag.pointerId) return;
        lens.releasePointerCapture(event.pointerId);
        lens.classList.remove('is-dragging');
        lens.classList.remove('is-pressed');
        lens.style.removeProperty('--drag-stretch-x');
        lens.style.removeProperty('--drag-stretch-y');
        lens.style.removeProperty('--drag-tilt');
        lens.classList.add('is-rebounding');
        drag = null;
      }

      lens.addEventListener('pointerup', finishDrag);
      lens.addEventListener('pointercancel', finishDrag);
      lens.addEventListener('animationend', (event) => {
        if (event.animationName === 'lens-rebound') lens.classList.remove('is-rebounding');
      });
      background.addEventListener('load', centreLens);
      window.addEventListener('resize', updateOptic);
      if (background.complete) centreLens();
    </script>
  </body>
</html>
